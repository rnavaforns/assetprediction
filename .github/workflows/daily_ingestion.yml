name: Data Ingestion & Model Training Pipeline

# Control de cuándo se ejecuta el workflow
on:
  schedule:
    # Se ejecuta de lunes a viernes a las 22:00 UTC (al cierre de los mercados)
    - cron: '0 22 * * 1-5'
  workflow_dispatch:
    # Permite activar el script manualmente desde la pestaña "Actions" de GitHub

jobs:
  ingest_and_train:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
    # 1. Clonar el repositorio en la máquina virtual
    - name: Checkout repository code
      uses: actions/checkout@v4

    # 2. Configurar la versión correcta de Python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip' # Optimiza ejecuciones futuras recordando las librerías de pip

    # 3. Cachear el modelo de Hugging Face (FinBERT)
    - name: Cache Hugging Face models
      uses: actions/cache@v4
      with:
        path: ~/.cache/huggingface
        key: ${{ runner.os }}-hf-finbert
        restore-keys: |
          ${{ runner.os }}-hf-

    # 4. Instalar dependencias del proyecto (con versión ligera de PyTorch para CPU)
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install torch --extra-index-url https://download.pytorch.org/whl/cpu
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # 5. Ejecutar el Pipeline de Mercado (Yahoo Finance)
    - name: Run Market Ingestion
      env:
        SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
        SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
        SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
        SUPABASE_DB_NAME: ${{ secrets.SUPABASE_DB_NAME }}
      run: python scripts/ingesta_market.py

    # 6. Ejecutar el Pipeline Macroeconómico (FRED API)
    - name: Run Macro Ingestion
      env:
        SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
        SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
        SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
        SUPABASE_DB_NAME: ${{ secrets.SUPABASE_DB_NAME }}
        FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      run: python scripts/ingesta_macro.py

    # 7. Ejecutar el Pipeline de Sentimiento (FinBERT)
    - name: Run Sentiment Ingestion
      env:
        SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
        SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
        SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
        SUPABASE_DB_NAME: ${{ secrets.SUPABASE_DB_NAME }}
        FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      run: python scripts/ingesta_sentiment.py
      
    # 8. Transformación Bronze -> Silver
    - name: Transformación Bronze -> Silver
      env:
        SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
        SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
        SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
        SUPABASE_DB_NAME: ${{ secrets.SUPABASE_DB_NAME }}
        FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      run: python scripts/transform_silver.py

    # 9. Transformación Silver -> Gold
    - name: Transformación Silver -> Gold
      env:
        SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
        SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
        SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
        SUPABASE_DB_NAME: ${{ secrets.SUPABASE_DB_NAME }}
      run: python scripts/build_gold.py --horizon 5

    # 10. Extracción Única: Crea el .parquet local
    - name: Fetch Gold Dataset to Local Parquet
      env:
        SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
        SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
        SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
        SUPABASE_DB_NAME: ${{ secrets.SUPABASE_DB_NAME }}
      run: python scripts/fetch_data.py

    # =========================================================================
    # MODELOS DE REGRESIÓN (ESTUDIO DE ABLACIÓN)
    # =========================================================================

    # 11. Regresor Baseline (Split 80/20 simple, MSE Loss)
    - name: Train Baseline XGBoost Regressor
      env:
        WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
      run: python scripts/train_xgboost.py

    # 12. Regresor Walk-Forward (CV con embargo de 5 días)
    - name: Train XGBoost Walk-Forward Regressor
      env:
        WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
      run: python scripts/train_xgb_walkforward.py

    # 13. Regresor Baseline con Pseudo-Huber Loss + Optuna
    - name: Train XGBoost Regressor (Pseudo-Huber + Optuna)
      env:
        WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
      run: python scripts/train_xgboost_huber.py

    # 14. Modelo Regresor con (Walk-Forward CV + Embargo + Pseudo-Huber + Optuna)
    - name: Train XGBoost Walk-Forward Regressor (Pseudo-Huber + Optuna)
      env:
        WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
      run: python scripts/train_xgb_walkforward_huber.py

    # 15. Modelo regresor con (Walk-Forward CV + Embargo + Pseudo-Huber + Optuna) incluyendo variables temporales
    - name: Train XGBoost Walk-Forward Regressor (Pseudo-Huber + Optuna) with time variables
      env:
        WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
      run: python scripts/train_xgb_walkforward_huber_time.py

    # 16. Modelo CatBoost regresor con Walk-Forward + PseudoHuber + Optuna
    - name: Train CatBoost Walk-Forward Regressor (Pseudo-Huber + Optuna)
      env:
        WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
      run: python scripts/catboost_regression.py

    # 17. Modelo TFT Regresor
    - name: Train Temporal Fusion Transformer (TFT) Regressor
      env:
        WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
      run: python scripts/train_tft.py

    #18. Modelo TFT Regresor con WalkForward
    - name: Train Temporal Fusion Transformer (TFT) with WalkForward
      env:
        WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
      run: python scripts/train_tft_walkforward.py

    # =========================================================================
    # MODELOS DE CLASIFICACIÓN (DIRECCIONAL SUBE/BAJA)
    # =========================================================================

    # 19. Clasificador Baseline (Split 80/20 simple)
    - name: Train Baseline XGBoost Classifier
      env:
        WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
      run: python scripts/train_xgb_classifier.py

    # 20. Clasificador Avanzado (Walk-Forward CV + Embargo + Optuna)
    - name: Train XGBoost Walk-Forward Classifier (Optuna)
      env:
        WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
      run: python scripts/train_xgb_walkforward_classifier.py

    # 21. Clasificador CatBoost (Walk-Forward CV + Embargo + Optuna)
    - name: Train CatBoost Walk-Forward Classifier (Optuna)
      env:
        WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
      run: python scripts/catboost_classification.py